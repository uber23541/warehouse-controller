services:
  db:
    image: postgres:16-alpine
    container_name: postgres-warehouse
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 3s
      retries: 10

  redis:
    image: redis:alpine
    container_name: redis-warehouse
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    container_name: warehouse-controller
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: 'service_healthy'
      redis:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_DSN:    ${DB_DSN}
      HTTP_PORT: ${HTTP_PORT}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"

volumes:
  dbdata:
  redisdata: