apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-controller
  namespace: warehouse
  labels:
    app.kubernetes.io/name: warehouse-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: warehouse-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warehouse-controller
    spec:
      containers:
        - name: warehouse-controller
          image: ghcr.io/uber23541/warehouse-controller:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: warehouse-config
            - secretRef:
                name: warehouse-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
