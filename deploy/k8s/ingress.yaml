# Требует `minikube addons enable ingress` и записи <minikube ip> warehouse.local в hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: warehouse-controller
  namespace: warehouse
  labels:
    app.kubernetes.io/name: warehouse-controller
spec:
  ingressClassName: nginx
  rules:
    - host: warehouse.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: warehouse-controller
                port:
                  number: 8080
