# Шаблон. Скопируйте в secret.yaml (в git не коммитится), подставьте значения.
# DB_PASSWORD переиспользуется чартом bitnami/postgresql, поэтому пароль
# в DB_DSN должен совпадать с DB_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: warehouse-secrets
  namespace: warehouse
  labels:
    app.kubernetes.io/name: warehouse-controller
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_secret"
  DB_PASSWORD: "REPLACE_ME_db_password"
  # host = Service чарта postgresql (имя релиза warehouse-postgresql).
  DB_DSN: "host=warehouse-postgresql user=warehouse password=REPLACE_ME_db_password dbname=warehouse_db port=5432 sslmode=disable"
