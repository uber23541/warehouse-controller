# Имя релиза ДОЛЖНО быть warehouse-redis — Service мастера warehouse-redis-master
# ссылается REDIS_URL в ConfigMap.
auth:
  enabled: false

architecture: standalone

master:
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
